name: DailyWord

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DailyWord:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Shared
      - path: Resources/Words
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Daily Word
        PRODUCT_BUNDLE_IDENTIFIER: $(DW_BUNDLE_PREFIX).dailyword
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Config/DailyWord-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/DailyWord-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daily Word
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DWAppGroup: group.$(DW_BUNDLE_PREFIX).dailyword
        DWCloudContainer: iCloud.$(DW_BUNDLE_PREFIX).dailyword
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [dailyword]
    dependencies:
      - target: DailyWordWidget
        embed: true

  DailyWordWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widget
      - Shared
      - path: Resources/Words
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DailyWordWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        PRODUCT_BUNDLE_IDENTIFIER: $(DW_BUNDLE_PREFIX).dailyword.widget
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Config/DailyWordWidget-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/DailyWordWidget-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Daily Word
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DWAppGroup: group.$(DW_BUNDLE_PREFIX).dailyword
        DWCloudContainer: iCloud.$(DW_BUNDLE_PREFIX).dailyword
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Pure-logic tests (scheduler + daily rotation). No host app, so no signing needed.
  DailyWordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Models/Entry.swift
      - Shared/Logic/Scheduler.swift
      - Shared/Logic/Rotation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DW_BUNDLE_PREFIX).dailyword.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  DailyWord:
    build:
      targets:
        DailyWord: all
        DailyWordWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [DailyWordTests]
